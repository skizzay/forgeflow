# Development-only database and build environment. No Docker socket is mounted.
services:
  db:
    image: postgres:17.11
    environment:
      POSTGRES_USER: slickflow_local
      POSTGRES_PASSWORD: local-only-not-for-deployment
      POSTGRES_DB: slickflow
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U slickflow_local -d slickflow']
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - database:/var/lib/postgresql/data
  build:
    image: maven:3.9.9-eclipse-temurin-21
    working_dir: /workspace
    environment:
      SLICKFLOW_DB_URL: jdbc:postgresql://db:5432/slickflow?currentSchema=slickflow
      SLICKFLOW_DB_USER: slickflow_local
      SLICKFLOW_DB_PASSWORD: local-only-not-for-deployment
      MAVEN_OPTS: -Xmx384m
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/workspace
      - maven-cache:/root/.m2
    ports:
      - '127.0.0.1:8080:8080'
volumes:
  database:
  maven-cache:
