spring.application.name=forgeflow-control-plane
spring.datasource.url=${FORGEFLOW_DB_URL}
spring.datasource.username=${FORGEFLOW_DB_USER}
spring.datasource.password=${FORGEFLOW_DB_PASSWORD}
spring.flyway.enabled=false
spring.flyway.schemas=forgeflow,flowable
spring.flyway.default-schema=forgeflow
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
server.address=127.0.0.1
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.diskspace.enabled=false
spring.main.banner-mode=off
management.endpoint.health.probes.enabled=false
