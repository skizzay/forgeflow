spring:
  application:
    name: slickflow-control-plane
  datasource:
    url: ${SLICKFLOW_DB_URL}
    username: ${SLICKFLOW_DB_USER}
    password: ${SLICKFLOW_DB_PASSWORD}
  flyway:
    enabled: false
  main:
    banner-mode: "off"
slickflow:
  execution:
    enabled: false
    inbox:
      enabled: false
      poll-interval: PT1S
  manual-approval:
    enabled: false
  worker:
    enabled: ${SLICKFLOW_WORKER_ENABLED:false}
    id: ${SLICKFLOW_WORKER_ID:}
    subject: ${SLICKFLOW_WORKER_SUBJECT:}
  github:
    webhook:
      enabled: ${SLICKFLOW_GITHUB_WEBHOOK_ENABLED:false}
      secret: ${SLICKFLOW_GITHUB_WEBHOOK_SECRET:}
      max-bytes: 1048576
      processing-enabled: true
      poll-interval: PT1S
  database:
    engine-schema: ${SLICKFLOW_ENGINE_SCHEMA:flowable}
server:
  address: 127.0.0.1
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: false
  health:
    diskspace:
      enabled: false
