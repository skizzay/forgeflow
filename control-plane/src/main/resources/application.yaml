spring:
  application:
    name: forgeflow-control-plane
  datasource:
    url: ${FORGEFLOW_DB_URL}
    username: ${FORGEFLOW_DB_USER}
    password: ${FORGEFLOW_DB_PASSWORD}
  flyway:
    enabled: false
  main:
    banner-mode: "off"
forgeflow:
  execution:
    enabled: false
  manual-approval:
    enabled: false
  worker:
    enabled: ${FORGEFLOW_WORKER_ENABLED:false}
    id: ${FORGEFLOW_WORKER_ID:}
    subject: ${FORGEFLOW_WORKER_SUBJECT:}
  github:
    webhook:
      enabled: ${FORGEFLOW_GITHUB_WEBHOOK_ENABLED:false}
      secret: ${FORGEFLOW_GITHUB_WEBHOOK_SECRET:}
      max-bytes: 1048576
      processing-enabled: true
      poll-interval: PT1S
  database:
    engine-schema: ${FORGEFLOW_ENGINE_SCHEMA:flowable}
server:
  address: 127.0.0.1
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: false
  health:
    diskspace:
      enabled: false
